name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development formatter
        run: python -m pip install -r requirements-dev.txt
      - name: Formatting
        run: python -m black --check .
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"
      - name: Repository checks
        run: python scripts/check_repository.py
      - name: Build release ZIPs without claiming DCC validation
        run: python scripts/build_release.py
